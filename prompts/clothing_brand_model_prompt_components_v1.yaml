schema_version: '1.0'
purpose: Composable prompt vocabulary for generating fashion e-commerce/model images for a clothing brand.
usage_notes:
  selection: Choose one or more compatible values from each section. Omit irrelevant fields.
  prompt_order:
  - model.demographics
  - model.skin
  - model.face
  - model.hair
  - garment
  - styling
  - pose
  - expression
  - accessories
  - background
  - lighting
  - camera
  - composition
  - rendering
  - constraints
  paired_views: For front/back product sets, keep model identity, garment, background, lighting, camera height, crop, and
    color treatment identical; change only pose/view.
  product_accuracy: Use garment.logo_or_print=none and constraints.product_fidelity entries when generating blank mockups.
