prompt_templates:
  generic: '{model_age} {indian_region_look} {gender_presentation} model, {skin_tone} skin with {undertone} undertone, {face_shape}
    face, {facial_hair_or_makeup}, {hair_style} {hair_color} hair, wearing a {garment_color} {fit} {garment_category} with
    {sleeve} and {neckline}, {fabric}, styled with {bottomwear} and {accessories}, {primary_view}, {body_pose}, {head_direction},
    {expression} expression, {background}, {lighting}, {shot_size}, {camera_angle}, {lens_look}, {realism}, {color_grade}.'
  clean_ecommerce_front: Indian {gender_presentation} fashion model, {skin_tone} skin, {hair_style}, wearing a pristine {garment_color}
    {garment_category}, {fit}, {sleeve}, {neckline}, blank with no logo or print. Neutral front product view, arms slightly
    away from torso, hands clear of garment, entire t-shirt visible. {background}, soft even studio lighting, eye-level straight-on
    camera, {shot_size}, {lens_look}, photorealistic high-end e-commerce photography, accurate garment color and fabric texture.
  clean_ecommerce_back: Same Indian {gender_presentation} model and identical styling as the front image, wearing the exact
    same {garment_color} {garment_category}. Neutral back product view, straight posture, arms slightly away from torso, hair
    and accessories not covering the back of the garment, entire back panel and sleeves visible. {background}, identical soft
    even studio lighting, camera height, framing, lens, white balance and exposure as front image, photorealistic high-end
    e-commerce photography.
  negative_prompt: '{avoid}'
compatibility_rules:
- male_facial_hair applies only when gender_presentation=male.
- female_makeup is primarily intended when gender_presentation=female; omit if not wanted.
- female_crop_t_shirt and female_crop_top are intended for female styling unless deliberately creating gender-neutral fashion.
- polo_collar pairs naturally with polo_t_shirt; henley_neck pairs naturally with henley.
- For back-view product images, avoid long loose hair unless tied up or moved clear of the garment.
- For blank apparel mockups, use logo_or_print=none and avoid jewelry/bags that overlap the garment.
- For pure_white garments, use off_white/light_grey backgrounds or controlled edge lighting if silhouette separation is needed.
- For marketplace/e-commerce sets, favor neutral poses, minimal accessories, neutral product-accurate color grade, and 50mm-85mm
  lens looks.
- Avoid combining mutually exclusive pose directions or multiple conflicting hairstyles in one prompt.
