schema_version: '1.1'
purpose: Live dropdown vocabulary for Model Studio fashion e-commerce imagery.
usage_notes:
  selection: Choose compatible values from the visible controls. Omit irrelevant fields.
  children: Child presets are intended for ages 4 to 17 and must remain age-appropriate.
  product_accuracy: Keep accessories clear of the garment print area, neckline, sleeves, and hem.

model:
  gender_presentation: [female, male, androgynous, girl, boy]
  age_group:
    adult: ['18_24', '25_34', '35_44', '45_54', 55_plus]
    kids: ['4_5', '6_7', '8_9', '10_11', '12_13', '14_15', '16_17']
  indian_region_look: [north_indian, south_indian, east_indian, west_indian, central_indian, northeast_indian, pan_indian, region_unspecified]
  body_build:
    male: [slim, lean, athletic, average, broad_shouldered, muscular, plus_size]
    female: [petite, slim, lean, athletic, average, curvy, plus_size, tall]
    kids: [petite, slim, average, sturdy, tall_for_age]
  skin:
    tone: [very_light_brown, light_brown, light_medium_brown, medium_brown, warm_medium_brown, golden_brown, olive_brown, tan_brown, deep_brown, dark_brown, very_deep_brown]
    undertone: [warm, neutral, cool, golden, olive, reddish]
  face:
    male_facial_hair: [clean_shaven, light_stubble, medium_stubble, short_boxed_beard, full_beard, trimmed_beard, mustache_only]
    female_makeup: [no_makeup_look, natural_makeup, minimal_commercial_makeup, soft_glam, matte_makeup, dewy_makeup]
  hair:
    male_style: [buzz_cut, crew_cut, short_crop, textured_crop, side_part, quiff, low_fade, curly_short, wavy_short, medium_layered, shoulder_length]
    female_style: [pixie_cut, short_bob, chin_length_bob, lob, straight_shoulder_length, straight_long, wavy_shoulder_length, long_waves, loose_curls, high_ponytail, low_ponytail, high_bun, low_bun, single_braid, two_braids, half_up_half_down]
    kids_boy_style: [neat_short_crop, crew_cut, side_part, textured_short, curly_short, medium_layered]
    kids_girl_style: [short_bob, shoulder_length, long_straight, loose_curls, high_ponytail, low_ponytail, two_ponytails, single_braid, two_braids, half_up_half_down]
    color: [natural_black, soft_black, dark_brown, medium_brown]

garment:
  category: [female_classic_tshirt, female_full_sleeve_tshirt, female_crop_tshirt, female_tank_top, female_baby_tee, male_classic_tshirt, male_full_sleeve_tshirt, male_v_neck_tshirt, male_polo_tshirt, male_sleeveless_tshirt, male_raglan_tshirt, unisex_basic_tshirt, unisex_oversized_tshirt, unisex_oversized_raglan_tshirt, unisex_hoodie, unisex_oversized_hoodie, unisex_sweatshirt, kids_half_sleeve_tshirt, kids_hoodie]
  color: [pure_white, off_white, cream, black, charcoal, heather_grey, light_grey, navy, royal_blue, sky_blue, teal, forest_green, olive, sage, red, maroon, burgundy, orange, mustard, yellow, lavender, purple, pink, dusty_pink, beige, brown]
  print_state: [blank, front_print, back_print, front_and_back_print]
  tuck:
    adult: [untucked, full_tuck, front_tuck]
    kids: [untucked]
  layering:
    adult: [none, open_shirt_over_tshirt, jacket_over_tshirt]
    kids: [none]

bottomwear:
  type:
    adult: [not_visible, blue_jeans, black_jeans, white_jeans, straight_jeans, wide_leg_jeans, chinos, tailored_trousers, cargo_pants, joggers, shorts, denim_shorts, skirt, midi_skirt, wide_leg_trousers, leggings]
    kids: [not_visible, blue_jeans, black_jeans, joggers, shorts, denim_shorts, leggings, simple_skirt]
  color: [black, white, blue_denim, light_blue_denim, dark_blue_denim, beige, khaki, navy, grey, olive]

style_direction:
  adult: [clean_ecommerce, premium_minimal, youthful_streetwear, editorial_fashion, lifestyle_casual, sporty_athleisure]
  kids: [clean_ecommerce, youthful_streetwear, lifestyle_casual, sporty_athleisure, playful_kids_catalogue]

pose:
  primary_view: [front, back, left_three_quarter, right_three_quarter, left_profile, right_profile]
  body:
    adult: [relaxed_standing, straight_standing, walking, hands_in_pockets, arms_crossed, one_hand_on_hip]
    kids: [relaxed_standing, straight_standing, cheerful_walking, hands_by_sides, one_hand_in_pocket]
  head_direction: [looking_at_camera, looking_left, looking_right, slight_turn_left, slight_turn_right]

expression:
  adult: [neutral, calm, confident, subtle_smile, friendly_smile, serious_editorial, relaxed]
  kids: [natural_smile, cheerful_smile, playful, curious, calm, confident]

accessories:
  adult:
    eyewear: [none, aviator_sunglasses, wayfarer_sunglasses, round_sunglasses, rectangular_sunglasses, clear_glasses]
    headwear: [none, baseball_cap, dad_cap, bucket_hat, beanie]
    jewelry: [none, minimal_chain, pendant, stud_earrings, hoop_earrings, minimal_bracelet, ring]
    wrist: [none, minimal_watch, sport_watch, smartwatch]
    bags: [none, tote_bag, crossbody_bag, backpack, small_handbag]
    other: [none, scarf, bandana, belt, headphones_around_neck]
  kids:
    eyewear: [none, clear_glasses, round_sunglasses]
    headwear: [none, baseball_cap, bucket_hat, beanie]
    jewelry: [none, small_stud_earrings, friendship_bracelet]
    wrist: [none, colourful_watch, simple_watch]
    bags: [none, small_backpack, mini_crossbody_bag]
    other: [none, hairband, hair_clips, headphones_around_neck]

background:
  studio: [pure_white_seamless, off_white_seamless, light_grey_seamless, mid_grey_seamless, dark_grey_seamless, black_seamless, beige_seamless, warm_cream_seamless, pastel_blue_seamless, pastel_pink_seamless, pastel_yellow_seamless]
lighting:
  studio: [soft_even_studio, large_softbox, soft_front_light, soft_window_light, bright_high_key, gentle_edge_light]
camera:
  shot_size: [full_body, three_quarter_body, waist_up, chest_up]
  angle: [eye_level, slightly_low_angle, slightly_high_angle, straight_on]
  lens_look: [50mm_natural, 70mm_commercial, 85mm_portrait]
  orientation: [portrait, landscape]
  aspect_ratio: ['1:1', '4:5', '2:3', '3:4', '16:9']
composition:
  negative_space: [centered, space_left, space_right, space_above, balanced_negative_space]
rendering:
  realism: [photorealistic, high_end_commercial_photography, natural_lifestyle_photography, editorial_photography]
  color_grade: [neutral_product_accurate, warm_natural, cool_clean, soft_pastel, high_contrast_editorial]
  resolution_intent: [web_catalogue, marketplace_listing, website_hero, social_campaign]

constraints:
- age_appropriate_child_styling
- accurate_garment_color
- accurate_fabric_texture
- no_accessory_covering_print_area
- no_random_text_or_logos
- natural_anatomy
- garment_fully_visible
compatibility_rules:
- Girl and boy presentations use only the kids age, build, hair, pose, styling, and accessory vocabularies.
- Kids garment choices are restricted to half-sleeve T-shirts and hoodies.
- Facial hair and makeup are adult-only controls.
- Accessories must not obscure the garment print area, neckline, sleeves, or hem.
